# Google Cloud Build configuration for Cloud Run deployment
# Usage: gcloud builds submit --config=cloudbuild.yaml

steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/plasticgpt:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/plasticgpt:latest'
      - '.'

  # Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/plasticgpt:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/plasticgpt:latest'

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'plasticgpt'
      - '--image'
      - 'gcr.io/$PROJECT_ID/plasticgpt:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '1Gi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'

substitutions:
  _REGION: us-central1

images:
  - 'gcr.io/$PROJECT_ID/plasticgpt:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/plasticgpt:latest'

options:
  logging: CLOUD_LOGGING_ONLY
